[package]
name = "wasm-plugin-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "wasm_plugin_host"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "3.4.6"
wasmtime = { version = "44", features = ["cranelift", "pooling-allocator", "cache"] }
wasmtime-wasi = "44"
wasmtime-wasi-http = "44"
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }
notify = "8"
# Blocking HTTP for `host.http_fetch` — the guest-facing network capability.
# Blocking (not async) because wasmtime host functions are sync `func_wrap`s.
ureq = { version = "3", default-features = false, features = ["rustls"] }
wasmparser = "0.246.2"

[[bin]]
name = "plugin-host"
path = "src/main.rs"

[dev-dependencies]
wat = "1"
