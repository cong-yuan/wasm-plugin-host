name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check default host crates
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check -p wasm-plugin-host --all-targets
          cargo check -p dsh-wasm-host --all-targets
          cargo check -p plugin-sdk --all-targets

      - name: Test host
        run: cargo test -p wasm-plugin-host

      - name: Test dsh integration
        run: cargo test -p dsh-wasm-host

      - name: Test plugin SDK
        run: cargo test -p plugin-sdk

      - name: Release build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release -p wasm-plugin-host -p dsh-wasm-host -p plugin-sdk

  windows-rust:
    name: Windows Rust compatibility
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check host crates
        shell: pwsh
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check -p wasm-plugin-host --all-targets
          cargo check -p plugin-sdk --all-targets

      - name: Test host
        shell: pwsh
        run: cargo test -p wasm-plugin-host

      - name: Test plugin SDK
        shell: pwsh
        run: cargo test -p plugin-sdk

  components:
    name: Component Model smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust and wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/component-js-demo/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugins/component-python-demo/requirements.txt

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            plugins/component-rust-demo/target
            plugins/component-rust-demo-v2/target
            plugins/component-rust-ui-demo/target
            plugins/component-rust-hook-demo/target
            plugins/component-rust-demo/componentize/target
            plugins/component-rust-ui-demo/componentize/target
            plugins/component-rust-hook-demo/componentize/target
          key: ${{ runner.os }}-component-cargo-${{ hashFiles('Cargo.lock', 'plugins/component-rust-demo/**/Cargo.lock', 'plugins/component-rust-demo-v2/Cargo.lock', 'plugins/component-rust-ui-demo/**/Cargo.lock', 'plugins/component-rust-hook-demo/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-component-cargo-

      - name: Build Rust Component
        run: bash plugins/component-rust-demo/build-component.sh

      - name: Build Rust WIT 0.2 Component
        run: bash plugins/component-rust-demo-v2/build-component.sh

      - name: Build Rust WIT 0.3 typed-UI Component
        run: bash plugins/component-rust-ui-demo/build-component.sh

      - name: Build Rust WIT 0.4 typed-hook Component
        run: bash plugins/component-rust-hook-demo/build-component.sh

      - name: Build core plugin fixture
        run: cargo build -p hello-rust --target wasm32-wasip1

      - name: Validate core plugin artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            target/wasm32-wasip1/debug/hello_rust.wasm --json | python3 -m json.tool >/dev/null

      - name: Validate Rust Component artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            plugins/component-rust-demo/target/component-rust-demo.component.wasm --json | python3 -m json.tool >/dev/null

      - name: Validate Rust WIT 0.2 Component artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            plugins/component-rust-demo-v2/target/component-rust-demo-v2.component.wasm --json \
            > /tmp/component-v2-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/component-v2-report.json'))
          assert report['tool_dependencies']['component_echo_v2'] == ['component_base_v2']
          PY

      - name: Validate Rust WIT 0.3 typed-UI Component artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            plugins/component-rust-ui-demo/target/component-rust-ui-demo.component.wasm --json \
            > /tmp/component-v3-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/component-v3-report.json'))
          assert report['plugin'] == 'component-rust-ui-demo'
          assert report['has_ui'] is True
          assert report['tool_dependencies']['component_ui_echo'] == ['component_ui_base']
          PY

      - name: Validate Rust WIT 0.4 typed-hook Component artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            plugins/component-rust-hook-demo/target/component-rust-hook-demo.component.wasm --json \
            > /tmp/component-v4-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/component-v4-report.json'))
          assert report['plugin'] == 'component-rust-hook-demo'
          assert 'tools/pre-execute' in report['hooks']
          PY

      - name: Smoke Rust Component
        run: |
          cargo run -p wasm-plugin-host --example component_smoke -- \
            plugins/component-rust-demo/target/component-rust-demo.component.wasm \
            component_echo \
            sandboxed

      - name: Smoke Rust WIT 0.2 Component
        run: |
          cargo run -p wasm-plugin-host --example component_smoke -- \
            plugins/component-rust-demo-v2/target/component-rust-demo-v2.component.wasm \
            component_echo_v2 \
            sandboxed

      - name: Smoke Rust WIT 0.3 typed-UI Component
        run: |
          # This smoke validates the WIT 0.3 typed-UI transport. The fixture
          # requests UI authority, so use trusted compatibility mode here;
          # sandboxed UI allow/deny semantics have dedicated capability tests.
          cargo run -p wasm-plugin-host --example component_smoke -- \
            plugins/component-rust-ui-demo/target/component-rust-ui-demo.component.wasm \
            component_ui_echo

      - name: Smoke Rust WIT 0.4 typed-hook Component
        run: |
          cargo run -p wasm-plugin-host --example component_hook_smoke -- \
            plugins/component-rust-hook-demo/target/component-rust-hook-demo.component.wasm

      - name: Install Python Component toolchain
        run: python -m pip install -r plugins/component-python-demo/requirements.txt

      - name: Build Python WIT 0.3 Component
        working-directory: plugins/component-python-demo
        run: |
          mkdir -p dist
          componentize-py \
            -d ../../wit-v0.3 \
            -w plugin \
            componentize \
            --stub-wasi \
            -p . \
            app \
            -o dist/component-python-demo.component.wasm

      - name: Validate Python WIT 0.3 Component artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            plugins/component-python-demo/dist/component-python-demo.component.wasm --json | python -m json.tool >/dev/null

      - name: Smoke Python WIT 0.3 Component
        run: |
          cargo run -p wasm-plugin-host --example component_smoke -- \
            plugins/component-python-demo/dist/component-python-demo.component.wasm \
            python_component_echo \
            sandboxed

      - name: Install JS Component toolchain
        working-directory: plugins/component-js-demo
        run: npm ci --ignore-scripts

      - name: Build sandbox-safe JS Component
        working-directory: plugins/component-js-demo
        run: npm run build

      - name: Validate sandbox-safe JS Component artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            plugins/component-js-demo/dist/component-js-demo.component.wasm --json | python3 -m json.tool >/dev/null

      - name: Smoke sandbox-safe JS Component
        run: |
          cargo run -p wasm-plugin-host --example component_smoke -- \
            plugins/component-js-demo/dist/component-js-demo.component.wasm \
            js_component_echo \
            sandboxed

      - name: Build trusted Preview2 JS Component
        working-directory: plugins/component-js-demo
        run: npm run build:preview2

      - name: Validate Preview2 JS Component artifact
        run: |
          cargo run -p wasm-plugin-host -- plugin-check \
            plugins/component-js-demo/dist/component-js-demo.preview2.component.wasm --json | python3 -m json.tool >/dev/null

      - name: Smoke trusted Preview2 JS Component
        run: |
          cargo run -p wasm-plugin-host --example component_smoke -- \
            plugins/component-js-demo/dist/component-js-demo.preview2.component.wasm \
            js_component_echo

      - name: Smoke generated plugin scaffolds
        run: |
          rm -rf /tmp/generated-core /tmp/generated-rust /tmp/generated-js
          cargo run -p wasm-plugin-host -- plugin-new /tmp/generated-core --kind rust-core
          cargo run -p wasm-plugin-host -- plugin-new /tmp/generated-rust --kind rust-component
          cargo run -p wasm-plugin-host -- plugin-new /tmp/generated-js --kind js-component

          (cd /tmp/generated-core && cargo build --release --target wasm32-wasip1)
          cargo run -p wasm-plugin-host -- plugin-check \
            /tmp/generated-core/target/wasm32-wasip1/release/generated_core.wasm --json \
            | python3 -m json.tool >/dev/null

          (cd /tmp/generated-rust && ./build-component.sh)
          cargo run -p wasm-plugin-host -- plugin-check \
            /tmp/generated-rust/target/plugin.component.wasm --json \
            | python3 -m json.tool >/dev/null

          (cd /tmp/generated-js && npm install --ignore-scripts && npm run build)
          cargo run -p wasm-plugin-host -- plugin-check \
            /tmp/generated-js/dist/plugin.component.wasm --json \
            | python3 -m json.tool >/dev/null

  ui:
    name: UI plugin harnesses
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/hana-shell/package-lock.json
            plugins/openhanako-shell/package-lock.json

      - name: Test hana-shell
        working-directory: plugins/hana-shell
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Test openhanako-shell
        working-directory: plugins/openhanako-shell
        run: |
          npm ci --ignore-scripts
          npm test
