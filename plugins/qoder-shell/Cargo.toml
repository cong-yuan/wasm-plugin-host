[package]
name = "qoder-shell"
version = "0.1.0"
edition = "2021"

# Recreates the Qoder CN shell as a WASM plugin: it owns the launch view, so
# the app opens *its* window at startup instead of the default page. Everything
# the user sees — sidebar, panels, composer — is drawn by this plugin.

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
