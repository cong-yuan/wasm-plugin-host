[package]
name = "openhanako-shell"
version = "0.1.0"
edition = "2021"

# Main openhanako frontend chrome (liliMozi/openhanako CSS) as a WASM plugin.
# Session/drag/test patterns absorbed from hana-shell.
# Chat JS calls Studio Tauri agent commands when invoke exists.
# Slot names in src/lib.rs stay the geometry surface.

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
