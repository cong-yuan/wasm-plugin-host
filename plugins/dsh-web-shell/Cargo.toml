[package]
name = "dsh-web-shell"
version = "0.1.0"
edition = "2021"

# A recreation of the dsh-web shell (zhu1090093659/dsh-web), as a WASM plugin.
#
# It owns the launch view and opens a **fine-grained slot at every region** of
# the layout, so later plugins can add features without touching this one.

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
