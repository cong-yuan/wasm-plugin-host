[package]
name = "demo-shell-addon"
version = "0.1.0"
edition = "2021"

# A SECOND plugin that adds features to `hana-shell` **without touching it**.
# It exists to prove the shell's slot surface works: this plugin knows nothing
# about the shell's internals, only the slot names.

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
