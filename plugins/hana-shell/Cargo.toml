[package]
name = "hana-shell"
version = "0.1.0"
edition = "2021"

# HanaAgent's chrome (liliMozi/openhanako), recreated as a WASM plugin on top of
# dsh-web's slot discipline.
#
# It owns the launch view and opens a **fine-grained slot at every region** of
# the layout, so later plugins can add features without touching this one.

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
